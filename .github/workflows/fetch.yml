name: Fetch Articles

on:
  schedule:
    # 每 4 小时一次(6 次/天),用 :17 避开被 GitHub throttle 的整点忙时槽。
    # 从原来每小时(~24 次/天)降下来,给三个垂直的 Gemini 免费额度留足空间;
    # 日报无需每小时刷,4 小时足够。需要更勤可改小间隔(注意 Gemini 250/天限额)。
    - cron: '17 */4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch and process articles
        run: node scripts/fetch.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}

      - name: Fetch stock + metal verticals (StockLens / MetalLens)
        if: always()   # crypto failure must not starve the other two sites
        run: node scripts/fetch-verticals.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
