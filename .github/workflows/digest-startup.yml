name: Send Startup Digest

on:
  # 定时已开(2026-07-28)。前置已验:手动 dispatch 跑过两次都 success(2026-07-24),Resend 域名已验证。
  # 要临时停发就把下面 schedule 两行重新注释掉,workflow_dispatch 保留可手动补发。
  schedule:
    - cron: '0 1 * * 1'   # 每周一 01:00 UTC = 北京时间周一 09:00
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Send startup digest
        run: node scripts/digest-startup.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
